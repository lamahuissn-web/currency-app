<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Count — design demo v2</title>
<style>
  :root{
    --bg:#000; --surface:#1C1C1E; --surface-high:#2C2C2E; --divider:#1A1A1C;
    --green:#00D632; --green-deep:#0E2A16; --text:#fff; --muted:#8E8E93;
    --red:#FF453A; --amber:#FFB020;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{margin:0; height:100%; background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
       color:var(--text); display:flex; justify-content:center}
  .screen{width:100%; max-width:430px; min-height:100vh; background:var(--bg);
          display:flex; flex-direction:column; padding:0 0 150px; position:relative}

  header{display:flex; align-items:flex-start; gap:12px; padding:26px 16px 4px}
  h1{margin:0; font-size:34px; line-height:1.05; font-weight:800; letter-spacing:-1.2px}
  .sub{margin:6px 0 0; font-size:12px; color:var(--muted)}
  .spacer{flex:1}
  .pill{display:flex; align-items:center; gap:8px; height:38px; padding:0 14px; background:var(--surface);
        border:0; border-radius:19px; color:var(--text); font:600 14px/1 inherit; cursor:pointer}
  .pill .flag{width:22px; height:22px; border-radius:50%; background:var(--surface-high);
              display:grid; place-items:center; font-size:9px; font-weight:800; color:var(--green)}
  .pill .chev{color:var(--muted); font-size:11px}

  .total{margin:12px 16px 6px; padding:16px 18px 14px; border-radius:20px;
         background:linear-gradient(180deg,#0B2413 0%,#081A0E 100%); border:1px solid #12301C}
  .total .head{display:flex; align-items:center; gap:10px}
  .total .label{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#6FAE85}
  .total .actions{margin-left:auto; display:flex; gap:6px; margin:-8px -6px -8px 0}
  .ghost{background:none; border:0; color:#A9CDBA; font:600 12.5px inherit; letter-spacing:.3px;
         cursor:pointer; padding:10px 7px; border-radius:10px}
  .total .amount{margin-top:6px; font-size:44px; line-height:1; font-weight:800; letter-spacing:-1.5px;
                 font-variant-numeric:tabular-nums}
  .total .amount .cents{color:var(--green)}
  .total .meta{margin-top:6px; font-size:12px; color:#93BBA6}

  .expected{margin-top:14px; padding-top:12px; border-top:1px solid #14351F;
            display:flex; align-items:center; gap:10px}
  .expected .ek{font-size:12px; color:#93BBA6}
  .expected .ev{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer}
  .expected .ev.unset{color:#6C8F7B; font-weight:600}
  .chip{display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 11px;
        border-radius:13px; font-size:11.5px; font-weight:700; letter-spacing:.2px}
  .chip.ok{background:rgba(0,214,50,.16); color:var(--green)}
  .chip.short{background:rgba(255,69,58,.16); color:var(--red)}
  .chip.over{background:rgba(255,176,32,.16); color:var(--amber)}
  .chip.none{background:var(--surface-high); color:var(--muted)}
  .chip.push{margin-left:auto}

  .section-label{padding:16px 16px 8px; font-size:11px; letter-spacing:.8px; text-transform:uppercase;
                 color:var(--muted); font-weight:600}
  .row{display:flex; align-items:center; gap:12px; padding:0 16px; height:64px; border-bottom:1px solid var(--divider)}
  .den{display:flex; flex-direction:column; gap:2px; min-width:74px}
  .den .note{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
  .den .kind{font-size:10.5px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase}
  .line{margin-left:auto; font-size:15px; font-weight:700; color:var(--green);
        font-variant-numeric:tabular-nums; min-width:86px; text-align:right}
  .line.zero{color:#56565C}
  .stepper{display:flex; align-items:center; gap:2px; background:var(--surface); border-radius:22px;
           padding:4px; margin-left:6px}
  .stepper button{width:40px; height:40px; border:0; border-radius:20px; background:#3A3A3E;
                  color:#F2F2F7; font-size:21px; font-weight:600; line-height:1; cursor:pointer;
                  display:grid; place-items:center; touch-action:manipulation}
  .stepper button.off{opacity:.28}
  .stepper button:active{transform:scale(.94)}
  .stepper .plus{background:var(--green); color:#fff; transition:box-shadow .12s}
  .stepper .plus.pressed{box-shadow:0 0 0 5px rgba(0,214,50,.25)}
  .stepper .count{min-width:34px; text-align:center; font-size:16px; font-weight:700;
                  font-variant-numeric:tabular-nums; cursor:pointer}

  nav{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:4px;
      padding:6px; border-radius:34px; background:var(--surface); box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
       width:92px; height:56px; border-radius:28px; color:var(--text); font-size:11px; font-weight:600;
       cursor:pointer}
  .tab .ico{display:grid; place-items:center; height:18px}
  .tab .ico svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.9;
                stroke-linecap:round; stroke-linejoin:round}
  .tab.active{background:var(--surface-high); color:var(--green)}

  .sheet{position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:flex-end; z-index:20}
  .sheet.open{display:flex}
  .card{width:100%; max-width:430px; margin:0 auto; background:var(--surface);
        border-radius:22px 22px 0 0; padding:10px 0 24px}
  .card h3{margin:12px 18px 8px; font-size:12px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted)}
  .opt{display:flex; align-items:center; gap:12px; height:56px; padding:0 18px; font-size:16px}
  .opt .flag{width:26px; height:26px; border-radius:50%; background:var(--surface-high); display:grid;
             place-items:center; font-size:10px; font-weight:800; color:var(--green)}
  .opt .tick{margin-left:auto; color:var(--green); font-weight:700}

  .kp-head{display:flex; align-items:flex-end; gap:12px; padding:6px 18px 2px}
  .kp-head .what{font-size:13px; color:var(--muted)}
  .kp-head .val{margin-left:auto; font-size:30px; font-weight:800; font-variant-numeric:tabular-nums}
  .kp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 18px 6px}
  .kp-grid button{height:56px; border:0; border-radius:16px; background:var(--surface-high);
                  color:var(--text); font-size:22px; font-weight:600; cursor:pointer}
  .kp-grid button.go{background:var(--green); color:#fff; font-size:15px; font-weight:800}

  .item{display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--divider)}
  .item .when{font-size:11px; color:var(--muted); margin-top:2px}
  .item .amt{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
  .item .right{margin-left:auto; text-align:right}
  .empty{padding:26px 18px; color:var(--muted); font-size:13px}
</style>
</head>
<body>
<div class="screen">

  <header>
    <div>
      <h1>Count</h1>
      <p class="sub" id="sub">US Dollar · banknotes</p>
    </div>
    <div class="spacer"></div>
    <button class="pill" id="currencyBtn">
      <span class="flag" id="pillFlag">US</span>
      <span id="pillCode">USD</span>
      <span class="chev">▾</span>
    </button>
  </header>

  <section class="total">
    <div class="head">
      <div class="label">Total counted</div>
      <div class="actions">
        <button class="ghost" id="historyBtn">History</button>
        <button class="ghost" id="saveBtn">Save</button>
        <button class="ghost" id="clearAll">Clear</button>
      </div>
    </div>
    <div class="amount" id="total">$0<span class="cents">.00</span></div>
    <div class="meta" id="meta">Tap + to count a stack</div>

    <div class="expected">
      <span class="ek">Expected</span>
      <span class="ev unset" id="expectedVal">set amount</span>
      <span class="chip none push" id="matchChip">—</span>
    </div>
  </section>

  <div class="section-label">Banknotes</div>
  <div id="list"></div>

  <nav>
    <div class="tab"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v18M16.5 6.5H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H7"/></svg></span><span>Convert</span></div>
    <div class="tab"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 4"/></svg></span><span>Chart</span></div>
    <div class="tab active"><span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.4"/><rect x="4" y="13" width="16" height="5" rx="1.4"/></svg></span><span>Count</span></div>
  </nav>
</div>

<div class="sheet" id="currencySheet">
  <div class="card">
    <h3>Count in</h3>
    <div class="opt" data-currency="USD"><span class="flag">US</span>US Dollar<span class="tick">✓</span></div>
    <div class="opt" data-currency="LBP"><span class="flag">LB</span>Lebanese Pound</div>
    <div class="opt" data-currency="EUR"><span class="flag">EU</span>Euro</div>
  </div>
</div>

<div class="sheet" id="keypadSheet">
  <div class="card">
    <div class="kp-head">
      <div class="what" id="kpWhat">Count</div>
      <div class="val" id="kpVal">0</div>
    </div>
    <div class="kp-grid" id="kpGrid">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="back">⌫</button><button data-k="0">0</button><button data-k="ok" class="go">Done</button>
    </div>
  </div>
</div>

<div class="sheet" id="historySheet">
  <div class="card">
    <h3>Saved counts</h3>
    <div id="histList"></div>
  </div>
</div>

<script>
const CURRENCIES = {
  USD: { symbol:"$", name:"US Dollar", notes:[100,50,20,10,5,1] },
  LBP: { symbol:"ل.ل ", name:"Lebanese Pound", notes:[100000,50000,20000,10000,5000,1000] },
  EUR: { symbol:"€", name:"Euro", notes:[200,100,50,20,10,5] }
};

const STORE = "count-demo-v2";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { saved = {}; }

const state = {
  currency: saved.currency || "USD",
  counts: saved.counts || {},
  expected: saved.expected || {},
  history: saved.history || []
};
const persist = () => localStorage.setItem(STORE, JSON.stringify(state));

const cur = () => CURRENCIES[state.currency];
const money = (v, code = state.currency) =>
  CURRENCIES[code].symbol + Math.round(v).toLocaleString("en-US");
const countsOf = (code = state.currency) => (state.counts[code] = state.counts[code] || {});
const expectedOf = (code = state.currency) => state.expected[code] || 0;

function totals() {
  const c = cur(), n = countsOf();
  let total = 0, notes = 0;
  c.notes.forEach(d => { const k = n[d] || 0; total += d * k; notes += k; });
  return { total, notes };
}

function render() {
  const c = cur(), n = countsOf();
  document.getElementById("pillCode").textContent = state.currency;
  document.getElementById("pillFlag").textContent = state.currency.slice(0, 2);
  document.getElementById("sub").textContent = c.name + " · banknotes";

  const list = document.getElementById("list");
  list.innerHTML = "";
  c.notes.forEach(d => {
    const k = n[d] || 0;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="den">
        <span class="note">${c.symbol}${d.toLocaleString("en-US")}</span>
        <span class="kind">banknote</span>
      </div>
      <div class="stepper">
        <button class="${k === 0 ? "off" : ""}" data-note="${d}" data-delta="-1">−</button>
        <div class="count" data-edit="${d}">${k}</div>
        <button class="plus" data-note="${d}" data-delta="1">+</button>
      </div>
      <div class="line ${k === 0 ? "zero" : ""}">${k === 0 ? "—" : money(d * k)}</div>`;
    list.appendChild(row);
  });

  const { total, notes } = totals();
  const whole = Math.floor(total).toLocaleString("en-US");
  document.getElementById("total").innerHTML = `${c.symbol}${whole}<span class="cents">.00</span>`;
  document.getElementById("meta").textContent =
    notes === 0 ? "Tap + to count a stack · long-press to type a count"
                : `${notes} note${notes === 1 ? "" : "s"} counted`;

  const exp = expectedOf();
  const ev = document.getElementById("expectedVal");
  const chip = document.getElementById("matchChip");
  if (exp > 0) {
    ev.textContent = money(exp);
    ev.classList.remove("unset");
    const diff = total - exp;
    chip.className = "chip push " + (diff === 0 ? "ok" : diff < 0 ? "short" : "over");
    chip.textContent = diff === 0 ? "✓ Match" : diff < 0 ? "Short " + money(-diff) : "Over " + money(diff);
  } else {
    ev.textContent = "set amount";
    ev.classList.add("unset");
    chip.className = "chip push none";
    chip.textContent = "—";
  }
  persist();
}

/* ----- steppers; a long press on + asks for a number ----- */
let pressTimer = null, longFired = false;

document.addEventListener("pointerdown", e => {
  const btn = e.target.closest("button.plus[data-note]");
  if (!btn) return;
  longFired = false;
  btn.classList.add("pressed");
  pressTimer = setTimeout(() => {
    longFired = true;
    btn.classList.remove("pressed");
    openKeypad(Number(btn.dataset.note));
  }, 420);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
  document.addEventListener(ev, () => {
    clearTimeout(pressTimer);
    document.querySelectorAll(".plus.pressed").forEach(b => b.classList.remove("pressed"));
  })
);

document.addEventListener("click", e => {
  if (longFired) { longFired = false; return; }

  const step = e.target.closest("button[data-note]");
  if (step) {
    const d = Number(step.dataset.note), delta = Number(step.dataset.delta);
    const n = countsOf();
    n[d] = Math.max(0, (n[d] || 0) + delta);
    render();
    return;
  }
  const edit = e.target.closest("[data-edit]");
  if (edit) openKeypad(Number(edit.dataset.edit));
});

/* ----- numeric keypad ----- */
let kp = { mode: "count", note: null, buffer: "" };

function openKeypad(note) {
  kp = { mode: "count", note, buffer: String(countsOf()[note] || 0), replacing: true };
  paintKeypad();
  document.getElementById("keypadSheet").classList.add("open");
}
function openExpected() {
  kp = { mode: "expected", note: null, buffer: String(expectedOf() || ""), replacing: true };
  paintKeypad();
  document.getElementById("keypadSheet").classList.add("open");
}
function paintKeypad() {
  const isCount = kp.mode === "count";
  document.getElementById("kpWhat").textContent = isCount
    ? `How many ${cur().symbol}${kp.note.toLocaleString("en-US")} notes?`
    : `Expected amount · ${state.currency}`;
  document.getElementById("kpVal").textContent = kp.buffer === "" ? "0" : kp.buffer;
}

document.getElementById("kpGrid").onclick = e => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  const k = b.dataset.k;
  if (k === "back") { kp.buffer = kp.buffer.slice(0, -1); kp.replacing = false; }
  else if (k === "ok") {
    const value = Number(kp.buffer || 0);
    if (kp.mode === "count") countsOf()[kp.note] = value;
    else state.expected[state.currency] = value;
    document.getElementById("keypadSheet").classList.remove("open");
    render();
    return;
  } else if (kp.buffer.length < 9) {
    if (kp.replacing) { kp.buffer = k; kp.replacing = false; }
    else kp.buffer = (kp.buffer === "0" ? "" : kp.buffer) + k;
  }
  paintKeypad();
};

document.getElementById("expectedVal").onclick = openExpected;

/* ----- clear / save / history ----- */
document.getElementById("clearAll").onclick = () => {
  state.counts[state.currency] = {};
  render();
};

document.getElementById("saveBtn").onclick = () => {
  const { total, notes } = totals();
  if (total === 0) return;
  state.history.unshift({
    at: new Date().toISOString(),
    code: state.currency,
    total, notes,
    expected: expectedOf()
  });
  state.history = state.history.slice(0, 40);
  persist();
  openHistory();
};

function openHistory() {
  const list = document.getElementById("histList");
  if (state.history.length === 0) {
    list.innerHTML = `<div class="empty">No saved counts yet. Count some notes and tap Save.</div>`;
  } else {
    list.innerHTML = state.history.map(h => {
      const when = new Date(h.at).toLocaleString("en-GB",
        { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
      const diff = h.expected > 0 ? h.total - h.expected : null;
      const chip = diff === null ? `<span class="chip none">no target</span>`
        : diff === 0 ? `<span class="chip ok">✓ Match</span>`
        : diff < 0 ? `<span class="chip short">Short ${money(-diff, h.code)}</span>`
        : `<span class="chip over">Over ${money(diff, h.code)}</span>`;
      return `<div class="item">
        <div>
          <div class="amt">${money(h.total, h.code)}</div>
          <div class="when">${when} · ${h.notes} notes · ${h.code}</div>
        </div>
        <div class="right">${chip}</div>
      </div>`;
    }).join("");
  }
  document.getElementById("historySheet").classList.add("open");
}
document.getElementById("historyBtn").onclick = openHistory;

/* ----- sheets ----- */
document.getElementById("currencyBtn").onclick = () =>
  document.getElementById("currencySheet").classList.add("open");

document.querySelectorAll(".sheet").forEach(sheet => {
  sheet.onclick = e => {
    if (e.target === sheet) return sheet.classList.remove("open");
    const opt = e.target.closest(".opt");
    if (!opt) return;
    state.currency = opt.dataset.currency;
    document.querySelectorAll(".opt .tick").forEach(t => t.remove());
    const tick = document.createElement("span");
    tick.className = "tick"; tick.textContent = "✓";
    opt.appendChild(tick);
    sheet.classList.remove("open");
    render();
  };
});

render();
</script>
</body>
</html>
