<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Count — design demo</title>
<style>
  :root{
    --bg:#000; --surface:#1C1C1E; --surface-high:#2C2C2E; --divider:#1A1A1C;
    --green:#00D632; --green-deep:#0E2A16; --text:#fff; --muted:#8E8E93;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
    color:var(--text); display:flex; justify-content:center;
  }
  .screen{
    width:100%; max-width:430px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; padding:0 0 152px; position:relative;
  }

  /* ---------- header ---------- */
  header{display:flex; align-items:flex-start; gap:12px; padding:26px 16px 6px}
  h1{margin:0; font-size:34px; line-height:1.05; font-weight:800; letter-spacing:-1.2px}
  .sub{margin:6px 0 0; font-size:12px; color:var(--muted); letter-spacing:.2px}
  .spacer{flex:1}
  .pill{
    display:flex; align-items:center; gap:8px; height:38px; padding:0 14px;
    background:var(--surface); border:0; border-radius:19px; color:var(--text);
    font:600 14px/1 inherit; letter-spacing:.2px; cursor:pointer;
  }
  .pill .flag{
    width:22px; height:22px; border-radius:50%; background:var(--surface-high);
    display:grid; place-items:center; font-size:9px; font-weight:800; color:var(--green);
    letter-spacing:.4px;
  }
  .pill .chev{color:var(--muted); font-size:11px; margin-left:2px}

  /* ---------- total ---------- */
  .total{margin:14px 16px 6px; padding:18px 18px 16px; border-radius:20px;
         background:linear-gradient(180deg, #0B2413 0%, #081A0E 100%);
         border:1px solid #12301C;}
  .total .head{display:flex; align-items:center}
  .total .label{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#6FAE85}
  .total .clear{margin-left:auto; background:none; border:0; color:#93BBA6; font:600 12px inherit;
                letter-spacing:.4px; cursor:pointer; padding:2px 4px}
  .total .amount{
    margin-top:6px; font-size:44px; line-height:1; font-weight:800; letter-spacing:-1.5px;
    font-variant-numeric:tabular-nums;
  }
  .total .amount .cents{color:var(--green)}
  .total .meta{margin-top:8px; font-size:12px; color:#93BBA6}

  /* ---------- denomination rows ---------- */
  .section-label{padding:18px 16px 8px; font-size:11px; letter-spacing:.8px;
                 text-transform:uppercase; color:var(--muted); font-weight:600}
  .list{display:flex; flex-direction:column}
  .row{display:flex; align-items:center; gap:12px; padding:0 16px; height:68px;
       border-bottom:1px solid var(--divider)}
  .den{display:flex; flex-direction:column; gap:2px; min-width:74px}
  .den .note{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
  .den .kind{font-size:10.5px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase}
  .line{margin-left:auto; font-size:15px; font-weight:700; color:var(--green);
        font-variant-numeric:tabular-nums; min-width:86px; text-align:right}
  .line.zero{color:#56565C}

  .stepper{display:flex; align-items:center; gap:2px; background:var(--surface);
           border-radius:22px; padding:4px; margin-left:6px}
  .stepper button{
    width:40px; height:40px; border:0; border-radius:20px; background:var(--surface-high);
    color:var(--text); font-size:21px; font-weight:600; line-height:1; cursor:pointer;
    display:grid; place-items:center;
  }
  .stepper button.off{opacity:.28; cursor:default}
  .stepper button:active{transform:scale(.94)}
  .stepper .plus{background:var(--green); color:#fff}
  .stepper .count{min-width:34px; text-align:center; font-size:16px; font-weight:700;
                  font-variant-numeric:tabular-nums}

  /* ---------- bottom nav ---------- */
  nav{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; gap:4px; padding:6px; border-radius:34px; background:var(--surface);
    box-shadow:0 10px 40px rgba(0,0,0,.6);
  }
  .tab{display:flex; flex-direction:column; align-items:center; justify-content:center;
       gap:2px; width:92px; height:56px; border-radius:28px; color:var(--text);
       font-size:11px; font-weight:600; cursor:pointer}
  .tab .ico{display:grid; place-items:center; height:18px}
  .tab .ico svg{width:18px; height:18px; stroke:currentColor; fill:none;
                stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  .tab.active{background:var(--surface-high); color:var(--green)}

  /* ---------- currency sheet (demo) ---------- */
  .sheet{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end}
  .sheet.open{display:flex}
  .sheet .card{width:100%; max-width:430px; margin:0 auto; background:var(--surface);
               border-radius:22px 22px 0 0; padding:8px 0 22px}
  .sheet h3{margin:14px 18px 10px; font-size:13px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted)}
  .sheet .opt{display:flex; align-items:center; gap:12px; height:56px; padding:0 18px; font-size:16px}
  .sheet .opt .flag{width:26px; height:26px; border-radius:50%; background:var(--surface-high);
                    display:grid; place-items:center; font-size:10px; font-weight:800; color:var(--green)}
  .sheet .opt .tick{margin-left:auto; color:var(--green); font-weight:700}
</style>
</head>
<body>
<div class="screen">

  <header>
    <div>
      <h1>Count</h1>
      <p class="sub" id="sub">US Dollar · banknotes</p>
    </div>
    <div class="spacer"></div>
    <button class="pill" id="currencyBtn">
      <span class="flag" id="pillFlag">US</span>
      <span id="pillCode">USD</span>
      <span class="chev">▾</span>
    </button>
  </header>

  <section class="total">
    <div class="head"><div class="label">Total counted</div><button class="clear" id="clearAll">Clear</button></div>
    <div class="amount" id="total">$0<span class="cents">.00</span></div>
    <div class="meta" id="meta">Tap + to count a stack</div>
  </section>

  <div class="section-label">Banknotes</div>
  <div class="list" id="list"></div>

  <nav>
    <div class="tab"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v18M16.5 6.5H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H7"/></svg></span><span>Convert</span></div>
    <div class="tab"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 4"/></svg></span><span>Chart</span></div>
    <div class="tab active"><span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.4"/><rect x="4" y="13" width="16" height="5" rx="1.4"/></svg></span><span>Count</span></div>
  </nav>
</div>

<div class="sheet" id="sheet">
  <div class="card">
    <h3>Count in</h3>
    <div class="opt" data-currency="USD"><span class="flag">US</span>US Dollar<span class="tick">✓</span></div>
    <div class="opt" data-currency="LBP"><span class="flag">LB</span>Lebanese Pound</div>
    <div class="opt" data-currency="EUR"><span class="flag">EU</span>Euro</div>
  </div>
</div>

<script>
  const CURRENCIES = {
    USD: { symbol: "$", name: "US Dollar", notes: [100, 50, 20, 10, 5, 2, 1] },
    LBP: { symbol: "ل.ل ", name: "Lebanese Pound", notes: [100000, 50000, 20000, 10000, 5000, 1000] },
    EUR: { symbol: "€", name: "Euro", notes: [200, 100, 50, 20, 10, 5] }
  };

  let currency = "USD";
  const counts = {};   // counts[currency][note] = n

  const fmt = (n, code) => {
    const c = CURRENCIES[code];
    const v = n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    return c.symbol + v;
  };

  function render() {
    const c = CURRENCIES[currency];
    counts[currency] = counts[currency] || {};

    document.getElementById("pillCode").textContent = currency;
    document.getElementById("pillFlag").textContent = currency.slice(0, 2);
    document.getElementById("sub").textContent = c.name + " · banknotes";

    const list = document.getElementById("list");
    list.innerHTML = "";

    let total = 0, notes = 0;
    c.notes.forEach(note => {
      const n = counts[currency][note] || 0;
      total += note * n;
      notes += n;

      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="den">
          <span class="note">${c.symbol}${note.toLocaleString("en-US")}</span>
          <span class="kind">banknote</span>
        </div>
        <div class="stepper">
          <button class="${n === 0 ? "off" : ""}" data-note="${note}" data-delta="-1">−</button>
          <div class="count">${n}</div>
          <button class="plus" data-note="${note}" data-delta="1">+</button>
        </div>
        <div class="line ${n === 0 ? "zero" : ""}">${n === 0 ? "—" : fmt(note * n, currency)}</div>`;
      list.appendChild(row);
    });

    const whole = Math.floor(total).toLocaleString("en-US");
    document.getElementById("total").innerHTML =
      `${c.symbol}${whole}<span class="cents">.00</span>`;
    document.getElementById("meta").textContent =
      notes === 0 ? "Tap + to count a stack"
                  : `${notes} note${notes === 1 ? "" : "s"} counted`;
  }

  document.addEventListener("click", e => {
    const btn = e.target.closest("button[data-note]");
    if (btn) {
      const note = Number(btn.dataset.note);
      const delta = Number(btn.dataset.delta);
      counts[currency] = counts[currency] || {};
      counts[currency][note] = Math.max(0, (counts[currency][note] || 0) + delta);
      render();
    }
  });

  document.getElementById("clearAll").onclick = () => {
    counts[currency] = {};
    render();
  };

  const sheet = document.getElementById("sheet");
  document.getElementById("currencyBtn").onclick = () => sheet.classList.add("open");
  sheet.onclick = e => {
    if (e.target === sheet) return sheet.classList.remove("open");
    const opt = e.target.closest(".opt");
    if (!opt) return;
    currency = opt.dataset.currency;
    document.querySelectorAll(".tick").forEach(t => t.remove());
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.textContent = "✓";
    opt.appendChild(tick);
    sheet.classList.remove("open");
    render();
  };

  render();
</script>
</body>
</html>
