name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName to stamp (e.g. 1.0.3). Leave empty to use build.gradle.kts."
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android@v3 is not used: it still asks sdkmanager for the legacy
      # "tools" package, which Google removed, and the action dies before installing anything.
      # The runner image already carries cmdline-tools, so the packages this build needs are
      # installed by name — the API 37 platform package carries its minor version.
      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The signing key never lives in the repository: it is base64 in a secret and written to the
      # runner's temp dir, then pointed at by the same env var a local build uses.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keys/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keys/keystore.properties"
          chmod 600 "$RUNNER_TEMP/keys/keystore.properties"
          echo "CURRENCY_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keys/keystore.properties" >> "$GITHUB_ENV"

      - name: Stamp version (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name != '' }}
        run: |
          set -euo pipefail
          NAME="${{ inputs.version_name }}"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NAME\"/" app/build.gradle.kts
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode = [0-9]*/versionCode = $CODE/" app/build.gradle.kts
          grep -nE "versionCode|versionName" app/build.gradle.kts

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Verify the artifact
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^application-label:"
          "$BT/apksigner" verify --print-certs "$APK" | grep "SHA-256 digest"
          sha256sum "$APK"
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: currency-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
